  g.fillStyle=gr;g.fillRect(0,0,r*2,r*2);return s;}

    g.fillStyle=col;circ(g,0,0,r*.8);g.fill();g.fillStyle=core;g.globalAlpha=.8;circ(g,-r*.2,-r*.2,r*.3);g.fill();break;
  case 'blob':g.fillStyle=col;for(let i=0;i<5;i++){const a=i/5*TAU;circ(g,Math.cos(a)*r*.45,Math.sin(a)*r*.45,r*.6);g.fill();}
    circ(g,0,0,r);g.fill();g.fillStyle=core;g.globalAlpha=.8;circ(g,-r*.25,-r*.25,r*.38);g.fill();break;
  case 'mito':{const L=r*1.15,w=r*.62;g.fillStyle=col;g.beginPath();g.roundRect?g.roundRect(-L,-w,2*L,2*w,w):g.rect(-L,-w,2*L,2*w);g.fill();
    g.strokeStyle=fl?'#fff':'#ffb27a';g.lineWidth=2;g.beginPath();g.roundRect?g.roundRect(-L+3,-w+3,2*L-6,2*w-6,w-3):0;g.stroke();
    g.strokeStyle=core;g.lineWidth=2.2;g.beginPath();for(let i=0;i<=24;i++){const x=-L*.78+i/24*L*1.56,y=Math.sin(i/24*TAU*3.2)*w*.55;i?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();break;}
  case 'cell':g.fillStyle=col;g.globalAlpha=.55;circ(g,0,0,r);g.fill();g.globalAlpha=1;g.strokeStyle=col;g.lineWidth=3;circ(g,0,0,r-1.5);g.stroke();
    g.fillStyle=fl?'#fff':'#ffc0cc';for(let i=0;i<7;i++){const a=i*2.4,d=r*(.45+.35*((i*37)%10)/10);circ(g,Math.cos(a)*d,Math.sin(a)*d,1.6);g.fill();}

  case 'bigcell':g.fillStyle=col;g.globalAlpha=.5;circ(g,0,0,r);g.fill();g.globalAlpha=1;g.strokeStyle=col;g.lineWidth=4;circ(g,0,0,r-2);g.stroke();

const bub={cache:new Map(),act:[],fade:[],key:''};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function chunkB(st,cx,cy,instant){const k=st+'|'+cx+'|'+cy;let a=bub.cache.get(k);if(a)return a;
  const SS=STAGE_S[st],CH=900*SS,r=mulberry((cx*73856093)^(cy*19349663)^(st*83492791)^RUNSEED);a=[];
  const q=r(),n=q<0.3?0:q<0.75?1:2;
  for(let i=0;i<n;i++){const rad=(55+r()*70)*SS,x=(cx+0.12+r()*0.76)*CH,y=(cy+0.12+r()*0.76)*CH,ph=r()*TAU;
    if(st===0&&Math.hypot(x,y)<rad+320)continue;
    if(Math.hypot(x-P.x,y-P.y)<rad+200*SS)continue;
    if(a.some(b=>Math.hypot(b.x-x,b.y-y)<b.r+rad+90*SS))continue;
    a.push({x,y,r:rad,a:instant?1:0,wob:0,ph});}
  bub.cache.set(k,a);return a;}
function updateBubbles(dt,instant){const st=P.stage,CH=900*STAGE_S[st],pcx=Math.floor(P.x/CH),pcy=Math.floor(P.y/CH),key=st+'|'+pcx+'|'+pcy;
  if(key!==bub.key){bub.key=key;const L=[];for(let ox=-2;ox<=2;ox++)for(let oy=-2;oy<=2;oy++)for(const b of chunkB(st,pcx+ox,pcy+oy,instant))L.push(b);bub.act=L;
    if(bub.cache.size>400){const keep=new Map();for(let ox=-2;ox<=2;ox++)for(let oy=-2;oy<=2;oy++){const k=st+'|'+(pcx+ox)+'|'+(pcy+oy);if(bub.cache.has(k))keep.set(k,bub.cache.get(k));}bub.cache=keep;}}
  for(const b of bub.act){if(b.a<1)b.a=Math.min(1,b.a+dt*1.6);if(b.wob>0)b.wob-=dt;}
  for(const b of bub.fade)b.a-=dt*1.5;bub.fade=bub.fade.filter(b=>b.a>0);
}
function bubbleStage(){bub.fade=bub.act.filter(b=>b.a>0);bub.act=[];bub.key='';}
function resetBubbles(){bub.cache=new Map();bub.act=[];bub.fade=[];bub.key='';updateBubbles(0,true);}
// push a circle out of solid bubbles; returns the bubble it touched
function pushOut(o,r){for(const b of bub.act){if(b.a<0.95)continue;const dx=o.x-b.x,dy=o.y-b.y,m=b.r+r;
  if(dx>m||dx<-m||dy>m||dy<-m)continue;const d2=dx*dx+dy*dy;if(d2<m*m){const d=Math.sqrt(d2)||0.01;o.x=b.x+dx/d*m;o.y=b.y+dy/d*m;return b;}}return null;}

const CAPT_TIME=1.6;

function advanceTrail(dt){

    for(let j=tr.length-4;j>=0;j--){const C=tr[j],D=tr[j+1];if(C.s<P.minSerial)break;
      const hit=segInt(L.x,L.y,B.x,B.y,C.x,C.y,D.x,D.y);
      if(hit){const poly=[hit];for(let k=j+1;k<tr.length;k++)poly.push(tr[k]);poly.push(B);

function cardAt(W,H,x,y){const r=cardRects(W,H);for(let i=0;i<3;i++){const c=r[i];if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h)return i;}return -1;}

// ---------- spatial hash ----------
let CELL=32;const grid=new Map();
function buildGrid(){grid.clear();let m=16;for(const e of enemies)if(!e.boss&&e.r>m)m=e.r;CELL=Math.max(32,m*2);
  for(const e of enemies){const k=((e.x/CELL)|0)*73856093^((e.y/CELL)|0)*19349663;let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(e);}}

// ---------- update ----------
function update(dt){
  T+=dt;
  P.S+=(targetS(P.tailLen)-P.S)*Math.min(1,dt*1.5);
  const S=P.S;
  let desired=P.a,kx=0,ky=0;
  if(keys.has('a')||keys.has('arrowleft'))kx--;if(keys.has('d')||keys.has('arrowright'))kx++;
  if(keys.has('w')||keys.has('arrowup'))ky--;if(keys.has('s')||keys.has('arrowdown'))ky++;
  if(DEMO){desired=P.a+(Math.sin(T*0.3)<-0.7?0.4:2.25)*dt;}
  else if(kx||ky)desired=Math.atan2(ky,kx);
  else{const dx=mx-W/2,dy=my-H/2;if(dx*dx+dy*dy>100)desired=Math.atan2(dy,dx);}
  const tr=P.turn*(P.dashT>0?1.3:1)*dt;P.a+=clamp(angDiff(P.a,desired),-tr,tr);
  const sp=P.spd*S*(P.dashT>0?2.3:1);
  P.x+=Math.cos(P.a)*sp*dt;P.y+=Math.sin(P.a)*sp*dt;
  {const hb=pushOut(P,11*S);if(hb)hb.wob=0.35;}
  if(P.dashT>0){P.dashT-=dt;P.dashAge+=dt;if((mdown||keys.has(' '))&&P.dashAge<P.dashHoldMax)P.dashT=Math.max(P.dashT,0.02);
    P.ghostT-=dt;if(P.ghostT<=0){P.ghostT=0.04;ghosts.push({x:P.x,y:P.y,a:P.a,life:0.32});}
    if(Math.random()<0.9)burst(P.x-Math.cos(P.a)*12*S,P.y-Math.sin(P.a)*12*S,1,'#b6ffd2',40,0.35,3);}
  if(P.dashCdT>0)P.dashCdT-=dt;
  if(P.inv>0)P.inv-=dt;
  if(DEMO&&captures.some(c=>c.cinchT<0&&c.charge>=2))dash();
  advanceTrail(dt);
  if(T>1.5&&!P.loops)tip('coil');tipTick();
  updateBubbles(dt);
  // boss gate + clear
  if(!P.boss&&!P.clearAt&&P.tailLen>=gateLen())spawnBoss();
  if(P.clearAt&&T>=P.clearAt){P.clearAt=0;state='clear';overT=0;endRun(true);return;}
  // spawn: VS-style waves with peaks, lulls and events
  waveTick(dt);
  gasTick(dt);chestTick();if(state!=='play')return;
  // pulse
  P.pulseT-=dt;
  if(P.pulseT<=0){P.pulseT=P.pulseInt;const R=P.pulseR*S,pts=[P];rings.push({x:P.x,y:P.y,r:10*S,R,life:0.25,max:0.25,col:'#5dffa0',w:3*S,follow:1});
    if(P.zap&&P.trail.length>8){const tr=P.trail,n=tr.length;for(let k=1;k<=4;k++){const q=tr[Math.floor(n*k/5)];pts.push(q);rings.push({x:q.x,y:q.y,r:8*S,R,life:0.25,max:0.25,col:'#8fd0ff',w:3*S});}}
    for(const q of pts)for(const e of enemies){if(e.dead)continue;const dx=e.x-q.x,dy=e.y-q.y,rr=R+e.r;
      if(dx*dx+dy*dy<rr*rr){if(!hurt(e,P.pulseDmg*(1+P.stage),1)){const d=Math.hypot(dx,dy)+1;e.vx+=dx/d*140*S;e.vy+=dy/d*140*S;}}}}
  // enemies
  buildGrid();tailTouch(dt,S);
  const far=Math.hypot(W,H)*1.1*S,headR=10*S,foodR=7*S;
  for(const e of enemies){
    if(e.dead)continue;
    const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)+0.001;
    if(d>far&&!e.cap){if(e.boss){const k=far*0.55/d;e.x=P.x-dx*k;e.y=P.y-dy*k;}else{e.dead=true;continue;}}
    if(e.slowT>0)e.slowT-=dt;
    const s=e.spd*Math.max(0.8,S/STAGE_S[e.t.st])*(e.cap?0.22:1)*(e.slowT>0?0.5:1);let ax=dx/d*s,ay=dy/d*s;
    if(e.sT>0&&!e.cap){e.sT-=dt;ax=e.sdx*s*1.3;ay=e.sdy*s*1.3;} // stream events cross the screen first
    if(e.t.k==='toxin'){e.puffT-=dt;if(e.puffT<=0){e.puffT=0.6;puff(e.x,e.y,e.r*1.8,3.5);}}
    const gx=(e.x/CELL)|0,gy=(e.y/CELL)|0;let sx=0,sy=0;
    for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){const a=grid.get((gx+ox)*73856093^(gy+oy)*19349663);if(!a)continue;
      for(const o of a){if(o===e)continue;const qx=e.x-o.x,qy=e.y-o.y,m=e.r+o.r;const q2=qx*qx+qy*qy;
        if(q2<m*m&&q2>0.01){const q=Math.sqrt(q2),w=o.r/(e.r+o.r);sx+=qx/q*(m-q)*w*2;sy+=qy/q*(m-q)*w*2;}}}
    if(e.cap){const cx=e.cap.c.x-e.x,cy=e.cap.c.y-e.y;ax+=cx*0.8;ay+=cy*0.8;}
    e.x+=(ax+e.vx)*dt+sx*0.35;e.y+=(ay+e.vy)*dt+sy*0.35;
    {const bb=pushOut(e,e.r*0.9);if(bb){let tx=-(e.y-bb.y),ty=e.x-bb.x;const tl=Math.hypot(tx,ty)+0.01;tx/=tl;ty/=tl;if(tx*dx+ty*dy<0){tx=-tx;ty=-ty;}e.x+=tx*s*dt*0.9;e.y+=ty*s*dt*0.9;}}
    e.vx*=Math.pow(0.02,dt);e.vy*=Math.pow(0.02,dt);
    if(e.t.rot)e.ang+=angDiff(e.ang,Math.atan2(ay,ax))*Math.min(1,dt*5);
    if(e.flash>0)e.flash-=dt;
    if(e.boss)bossTick(e,dt);
    if(d<e.r+headR){
      if(e.r<foodR&&!e.sh){kill(e,1);burst(e.x,e.y,4,'#b6ffd2',120,0.3,2);continue;} // tiny = food
      if(P.dashT>0){if(!hurt(e,2*(1+P.stage),1)){e.vx-=dx/d*300*S;e.vy-=dy/d*300*S;}}
      else if(P.inv<=0&&!DEMO){P.hp-=e.t.dmg;P.inv=0.75;shake=Math.max(shake,8);burst(P.x,P.y,14,'#ff6070',200,0.4,3);
        text(P.x,P.y-30*S,'-'+e.t.dmg,18,'#ff7080',0.6);e.vx-=dx/d*260*S;e.vy-=dy/d*260*S;
        if(P.hp<=0){P.hp=0;state='over';overT=0;burst(P.x,P.y,80,'#7dffb0',380,1.2,4);endRun(false);}}
    }
  }
  for(const c of captures){c.pop=Math.max(0,c.pop-dt*3);
    if(c.cinchT<0){c.timer-=dt;if(c.timer<=0){c.cinchT=0;c.dash=false;}}
    else{c.cinchT+=dt;if(c.cinchT>=0.2){explode(c);c.done=true;}}}
  compact(captures,c=>!c.done);
  compact(enemies,e=>!e.dead);
  const mag=P.magnet*S;
  for(const o of orbs){const dx=P.x-o.x,dy=P.y-o.y,d=Math.hypot(dx,dy)+0.001;
    if(d<mag){const s=(520*(1-d/mag)+160)*S;o.vx+=dx/d*s*dt*6;o.vy+=dy/d*s*dt*6;}
    o.x+=o.vx*dt;o.y+=o.vy*dt;o.vx*=Math.pow(0.05,dt);o.vy*=Math.pow(0.05,dt);
    if(d<16*S){o.dead=true;addXP(o.v);}}
  compact(orbs,o=>!o.dead);
  if(pendingLv>0&&state==='play'&&!P.clearAt)openLevel();
  if(DEMO&&P.hp<P.maxHp)P.hp+=dt*5;
}
function tailTouch(dt,S){if(!(P.spike||P.cilia))return;P.tailTick-=dt;if(P.tailTick>0)return;P.tailTick=0.1;
  const tr=P.trail,n=tr.length-6,rad=9*S,dmg=P.spike*(1+P.stage)*0.6;
  for(let i=0;i<n;i+=4){const q=tr[i],gx=(q.x/CELL)|0,gy=(q.y/CELL)|0;
    for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){const a=grid.get((gx+ox)*73856093^(gy+oy)*19349663);if(!a)continue;
      for(const e of a){if(e.dead)continue;const dx=e.x-q.x,dy=e.y-q.y,rr=e.r+rad;if(dx*dx+dy*dy>rr*rr)continue;
        if(P.cilia)e.slowT=0.9;
        if(P.spike&&e.spk<=T){e.spk=T+0.5;if(e.sh>0)continue;hurt(e,dmg,1);if(Math.random()<0.5)burst(e.x,e.y,2,'#eaffb0',90,0.25,2);}}}}}
function updateFx(dt){
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(0.08,dt);p.vy*=Math.pow(0.08,dt);p.life-=dt;}
  compact(parts,p=>p.life>0);
  for(const t of texts){t.life-=dt;t.y-=24*P.S*dt;}compact(texts,t=>t.life>0);
  for(const r of rings){r.life-=dt;if(r.follow){r.x=P.x;r.y=P.y;}}compact(rings,r=>r.life>0);
  for(const g of ghosts)g.life-=dt;compact(ghosts,g=>g.life>0);
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
  for(const t of toasts)t.life-=dt;toasts=toasts.filter(t=>t.life>0);
  if(evtMsg){evtMsg.t-=dt;if(evtMsg.t<=0)evtMsg=null;}
  shake=Math.max(0,shake-dt*40);if(flashT>0)flashT-=dt;
}

// ---------- render ----------
const motes=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),z:rand(0.2,0.7),r:rand(1,3)}));
function drawHead(x,y,a,s,alpha,hue,full){
  if(hue===undefined)hue=142;
  ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.scale(s,s);ctx.globalAlpha=alpha;
  if(full&&P.memb){const m=Math.min(P.memb,5);ctx.strokeStyle=`hsla(${hue},100%,78%,0.35)`;ctx.lineWidth=1.2+m*0.8;ctx.beginPath();ctx.ellipse(0,0,15+2.5*m,11+2.5*m,0,0,TAU);ctx.stroke();}
  if(full&&P.spike){const n=8+P.spike*3,L=1.25+0.18*P.spike;ctx.fillStyle=`hsl(${hue},55%,80%)`;
    for(let k=0;k<n;k++){const t=k/n*TAU,w=0.2;ctx.beginPath();ctx.moveTo(Math.cos(t-w)*14,Math.sin(t-w)*10);ctx.lineTo(Math.cos(t)*15*L,Math.sin(t)*11*L);ctx.lineTo(Math.cos(t+w)*14,Math.sin(t+w)*10);ctx.fill();}}
  ctx.fillStyle=`hsl(${hue},68%,50%)`;ctx.beginPath();ctx.ellipse(0,0,15,11,0,0,TAU);ctx.fill();
  ctx.fillStyle=`hsl(${hue},100%,81%)`;ctx.beginPath();ctx.ellipse(-3,-3,8,5,0,0,TAU);ctx.fill();
  if(full&&P.devour){ctx.fillStyle='#f2fff7';for(const k of[-1,1]){ctx.beginPath();ctx.moveTo(11,k*4);ctx.quadraticCurveTo(23,k*(10+2*Math.sin(T*12)),27,k*1.5);ctx.quadraticCurveTo(19,k*5.5,11,k*4);ctx.fill();}}
  if(alpha>=1){ctx.strokeStyle=`hsla(${hue},100%,80%,0.7)`;ctx.lineWidth=1.5;for(const k of[-1,1]){ctx.beginPath();ctx.moveTo(10,k*6);
    ctx.quadraticCurveTo(18,k*(10+3*Math.sin(T*25)),24,k*(6+4*Math.sin(T*25+1)));ctx.stroke();}
    ctx.fillStyle='#fff';for(const k of[-1,1]){ctx.beginPath();ctx.arc(7,k*5,3.6,0,TAU);ctx.fill();}
    ctx.fillStyle='#032';for(const k of[-1,1]){ctx.beginPath();ctx.arc(8.4,k*5,1.8,0,TAU);ctx.fill();}}
  ctx.restore();ctx.globalAlpha=1;
}
function drawTailParts(tr,hu,S){const n=tr.length;
  if(P.spike||P.cilia){
    for(let i=3;i<n-4;i+=3){const q=tr[i],p0=tr[i-1],p1=tr[i+1],tx=p1.x-p0.x,ty=p1.y-p0.y,tl=Math.hypot(tx,ty)+0.01,ux=tx/tl,uy=ty/tl,nx=-uy,ny=ux,w=(2.5+i/n*5)*S;
      if(P.spike&&i%6===0){const L=(5+2*P.spike)*S;ctx.fillStyle=`hsla(${hu},60%,84%,0.9)`;
        for(const g of[-1,1]){ctx.beginPath();ctx.moveTo(q.x+nx*g*w*0.6+ux*2.5*S,q.y+ny*g*w*0.6+uy*2.5*S);ctx.lineTo(q.x+nx*g*(w+L),q.y+ny*g*(w+L));ctx.lineTo(q.x+nx*g*w*0.6-ux*2.5*S,q.y+ny*g*w*0.6-uy*2.5*S);ctx.fill();}}
      if(P.cilia){const L=(4+2*Math.sin(T*18+i))*S;ctx.strokeStyle=`hsla(${hu},90%,86%,0.55)`;ctx.lineWidth=S;ctx.beginPath();
        for(const g of[-1,1]){ctx.moveTo(q.x+nx*g*w,q.y+ny*g*w);ctx.lineTo(q.x+nx*g*(w+L)-ux*2*S,q.y+ny*g*(w+L)-uy*2*S);}ctx.stroke();}}}
  if(P.bigcoil&&n>8){ctx.strokeStyle=`hsla(${(hu+50)%360},100%,80%,0.75)`;ctx.lineWidth=1.6*S;ctx.beginPath();
    for(let i=2;i<n-2;i+=2){const q=tr[i],p0=tr[i-1],p1=tr[i+1],tx=p1.x-p0.x,ty=p1.y-p0.y,tl=Math.hypot(tx,ty)+0.01,w=(2.5+i/n*5)*S*1.6,o=Math.sin(i*0.55+T*6)*w;
      const x=q.x-ty/tl*o,y=q.y+tx/tl*o;i>2?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}
  if(P.zap&&n>12){ctx.globalCompositeOperation='lighter';ctx.strokeStyle='rgba(150,215,255,0.8)';ctx.lineWidth=1.6*S;
    for(let z=0;z<2;z++){const i=4+(Math.random()*(n-10)|0),a=tr[i],b=tr[i+5];ctx.beginPath();ctx.moveTo(a.x,a.y);
      for(let j=1;j<4;j++){const f=j/4;ctx.lineTo(a.x+(b.x-a.x)*f+rand(-7,7)*S,a.y+(b.y-a.y)*f+rand(-7,7)*S);}ctx.lineTo(b.x,b.y);ctx.stroke();}
    ctx.globalCompositeOperation='source-over';}
  if(P.flag&&n>3){const q=tr[0],p=tr[2],dx=q.x-p.x,dy=q.y-p.y,dl=Math.hypot(dx,dy)+0.01,ux=dx/dl,uy=dy/dl,m=Math.min(4,P.flag);
    ctx.strokeStyle=`hsla(${hu},100%,80%,0.7)`;ctx.lineWidth=1.5*S;
    for(let k=0;k<m;k++){const sp=(k-(m-1)/2)*0.45,ca=Math.cos(sp),sa=Math.sin(sp),vx=ux*ca-uy*sa,vy=ux*sa+uy*ca;ctx.beginPath();ctx.moveTo(q.x,q.y);
      for(let j=1;j<=8;j++){const L=j*4.5*S,wv=Math.sin(T*16+j*0.9+k)*3*S*j/8;ctx.lineTo(q.x+vx*L-vy*wv,q.y+vy*L+vx*wv);}ctx.stroke();}}
}
function drawBubbles(x0,x1,y0,y1){const S=P.S;
  for(const L of[bub.fade,bub.act])for(const b of L){if(b.a<=0||b.x+b.r<x0||b.x-b.r>x1||b.y+b.r<y0||b.y-b.r>y1)continue;
    const R=b.r*(1+(b.wob>0?0.04*Math.sin(T*40)*b.wob/0.35:0));ctx.globalAlpha=Math.min(1,b.a);
    ctx.fillStyle='rgba(150,200,255,0.05)';circ(ctx,b.x,b.y,R);ctx.fill();
    ctx.strokeStyle='rgba(0,5,16,0.8)';ctx.lineWidth=R*0.17;circ(ctx,b.x,b.y,R*0.91);ctx.stroke();
    ctx.strokeStyle='rgba(150,205,255,0.32)';ctx.lineWidth=2*S;circ(ctx,b.x,b.y,R*0.8);ctx.stroke();
    ctx.strokeStyle='rgba(120,180,255,0.28)';ctx.lineWidth=1.5*S;circ(ctx,b.x,b.y,R);ctx.stroke();
    ctx.strokeStyle='rgba(235,248,255,0.5)';ctx.lineWidth=R*0.05;ctx.beginPath();ctx.arc(b.x,b.y,R*0.6,3.5+0.2*Math.sin(b.ph),4.5+0.2*Math.sin(b.ph));ctx.stroke();}
  ctx.globalAlpha=1;}
function drawGas(x0,x1,y0,y1){const S=P.S;
  for(const g of gas){if(g.x+g.r<x0||g.x-g.r>x1||g.y+g.r<y0||g.y-g.r>y1)continue;const a=Math.min(1,g.life/1.2,(g.max-g.life)/0.3+0.2);
    ctx.globalAlpha=0.85*a;ctx.drawImage(GASSPR,g.x-g.r*1.1,g.y-g.r*1.1,g.r*2.2,g.r*2.2);
    ctx.globalAlpha=0.6*a;ctx.strokeStyle='#d8f070';ctx.lineWidth=1.5*S;ctx.setLineDash([5*S,6*S]);ctx.beginPath();ctx.arc(g.x,g.y,g.r*0.85,0,TAU);ctx.stroke();ctx.setLineDash([]);}
  ctx.globalAlpha=1;}
function drawChests(){const S=P.S;
  for(const c of chests){const k=(c.evo?1.5:1)*S,bob=Math.sin(T*4+c.ph)*3*S;
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.6+0.3*Math.sin(T*6+c.ph);ctx.drawImage(CHESTGLOW,c.x-40*k,c.y-40*k+bob,80*k,80*k);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    ctx.save();ctx.translate(c.x,c.y+bob);ctx.rotate(Math.sin(T*2+c.ph)*0.25);ctx.scale(k,k);
    ctx.fillStyle=c.evo?'#ffd23f':'#9fe0ff';rrect(-16,-9,32,18,9);ctx.fill();ctx.strokeStyle='#fffbe6';ctx.lineWidth=1.5;ctx.stroke();
    ctx.strokeStyle=c.evo?'#7a4a00':'#0b4060';ctx.lineWidth=1.6;for(const ph of[0,Math.PI]){ctx.beginPath();for(let i=0;i<=12;i++){const x=-12+i*2,y=Math.sin(i*0.9+ph+T*3)*5;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}
    ctx.restore();}}
function drawShell(e,S){const B=e.boss,gap=B?9:5.5;ctx.lineWidth=(B?3.2:2)*S;
  for(let i=0;i<e.sh;i++){const R=e.r+(5+i*gap)*S,rot=T*0.7*(i%2?1:-1)+e.ph+i;ctx.strokeStyle=`rgba(214,242,255,${0.95-i*0.1})`;
    for(let k=0;k<5;k++){const a0=rot+k*TAU/5;ctx.beginPath();ctx.arc(e.x,e.y,R,a0,a0+TAU/5-0.32);ctx.stroke();}}
  if(B&&e.regenT>0){const R=e.r+(5+e.sh*gap)*S;ctx.strokeStyle=`rgba(160,200,230,${0.6*e.regenT/3.5})`;ctx.setLineDash([6*S,6*S]);ctx.beginPath();ctx.arc(e.x,e.y,R,0,TAU);ctx.stroke();ctx.setLineDash([]);}}
function render(){
  const S=P.S,Z=1/S;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#04102a';ctx.fillRect(0,0,W,H);
  const shx=(Math.random()-0.5)*shake,shy=(Math.random()-0.5)*shake;
  const cx=P.x+shx*S,cy=P.y+shy*S; // world point at screen center
  // motes (screen-space parallax)
  ctx.fillStyle='rgba(120,180,255,0.12)';
  for(const m of motes){const x=((m.x*W-cx*Z*m.z)%W+W)%W,y=((m.y*H-cy*Z*m.z)%H+H)%H;ctx.beginPath();ctx.arc(x,y,m.r,0,TAU);ctx.fill();}
  // world transform
  ctx.setTransform(DPR*Z,0,0,DPR*Z,DPR*(W/2-cx*Z),DPR*(H/2-cy*Z));
  const hw=W/2*S+100*S,hh=H/2*S+100*S,vx0=cx-hw,vx1=cx+hw,vy0=cy-hh,vy1=cy+hh;
  // grid (spacing grows with scale)
  const G=80*Math.pow(2,Math.floor(Math.log2(S)));
  ctx.strokeStyle='rgba(70,130,220,0.09)';ctx.lineWidth=S;ctx.beginPath();
  for(let x=Math.floor(vx0/G)*G;x<vx1;x+=G){ctx.moveTo(x,vy0);ctx.lineTo(x,vy1);}
  for(let y=Math.floor(vy0/G)*G;y<vy1;y+=G){ctx.moveTo(vx0,y);ctx.lineTo(vx1,y);}ctx.stroke();
  drawBubbles(vx0,vx1,vy0,vy1);
  drawGas(vx0,vx1,vy0,vy1);drawChests();
  // captures
  for(const c of captures){
    const k=c.cinchT<0?1:1-0.85*Math.pow(c.cinchT/0.2,2);

    ctx.font=`bold 13px ${FONTS[0]}`;ctx.fillStyle=i===LI?'#ffffff':'#8fb8d8';ctx.fillText(s,x+g.w/4,g.y+g.h/2+1);});
  fitFont(TX('title'),56,900,L.tw);ctx.fillStyle='#7dffb0';ctx.fillText(TX('title'),W/2,ty);
  fitFont(TX('tagline',VER),Math.min(14,fs)|0,'normal',W-24);ctx.fillStyle='#8fb8d8';ctx.fillText(TX('tagline',VER),W/2,ty+40);

  const k=SKINS[skinIdx],own=META.skins.includes(k.id),p=L.panel,now=performance.now();panel(p.x,p.y,p.w,p.h,0.88);

// ----- level up -----
const RC=['#7dffb0','#6fb8ff','#ffd23f'],RF=['rgba(3,14,34,','rgba(6,22,60,','rgba(44,32,4,'];
function chipText(u){if(!u.id)return'';const lv=P.lv[u.id]||0;return (u.r===1?TX('rare')+' ':'')+(lv===0?'NEW':'Lv'+lv+'→'+(lv+1===u.max?'MAX':lv+1));}
function levelScreen(W,H,mx,my){

  const r=cardRects(W,H),hov=TOUCH?-1:cardAt(W,H,mx,my),head=TX('lvup');
  ctx.fillStyle='#ffe680';fitFont(head,NARROW?26:34,900,W-24);ctx.fillText(head,W/2,r[0].y-(NARROW?34:56));
  r.forEach((c,i)=>{const u=choices[i];if(!u)return;const q=u.r||0,chip=chipText(u),hint=cardHint(u),cat=u.cat?TX('cat_'+u.cat):'',catc=u.cat==='atk'?'#ff9a7a':'#7fd8ff',sp=LI?'   ':'　';
    ctx.fillStyle=RF[q]+(hov===i?0.97:0.9)+')';ctx.strokeStyle=RC[q];ctx.lineWidth=q?2.5:1;rrect(c.x,c.y,c.w,c.h,10);ctx.fill();ctx.stroke();
    if(hov===i){ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.strokeRect(c.x+3,c.y+3,c.w-6,c.h-6);}
    let chipW=0;if(chip){ctx.font=`900 12px ${FONT}`;const tw=ctx.measureText(chip).width+14;chipW=tw+8;ctx.fillStyle=RC[q];ctx.fillRect(c.x+c.w-tw-8,c.y+8,tw,20);ctx.fillStyle='#04102a';ctx.textAlign='center';ctx.fillText(chip,c.x+c.w-tw/2-8,c.y+18);}
    const foot=cat+(hint?sp+hint:'');
    if(NARROW){ctx.textAlign='left';ctx.fillStyle=RC[q];ctx.font=`900 14px ${FONT}`;ctx.fillText(String(i+1),c.x+14,c.y+c.h/2);
      ctx.fillStyle='#fff';fitFont(u.n,19,900,c.w-50-chipW);ctx.fillText(u.n,c.x+36,c.y+24);
      const dd=oneLine(u.d);fitFont(dd,14,'normal',c.w-50);ctx.fillStyle='#bfe3ff';ctx.fillText(dd,c.x+36,c.y+50);
      fitFont(foot,12,'bold',c.w-50);ctx.fillStyle=catc;ctx.fillText(cat,c.x+36,c.y+73);
      if(hint){const cw=ctx.measureText(cat+sp).width;ctx.fillStyle='#ffd86a';ctx.fillText(hint,c.x+36+cw,c.y+73);}ctx.textAlign='center';}
    else{ctx.textAlign='left';ctx.fillStyle=RC[q];ctx.font=`900 14px ${FONT}`;ctx.fillText('['+(i+1)+']',c.x+12,c.y+18);
      const nw=ctx.measureText('['+(i+1)+'] ').width;ctx.font=`bold 12px ${FONT}`;ctx.fillStyle=catc;ctx.fillText(cat,c.x+12+nw,c.y+18);ctx.textAlign='center';
      ctx.fillStyle='#ffffff';fitFont(u.n,20,900,c.w-20);ctx.fillText(u.n,c.x+c.w/2,c.y+50);
      ctx.fillStyle='#bfe3ff';u.d.split('\n').forEach((t,k)=>{fitFont(t,14,'normal',c.w-16);ctx.fillText(t,c.x+c.w/2,c.y+82+k*21);});
      if(hint){fitFont(hint,12,'bold',c.w-14);ctx.fillStyle='#ffd86a';ctx.fillText(hint,c.x+c.w/2,c.y+c.h-14);}}});
  ctx.font=`13px ${FONT}`;ctx.fillStyle='#8fb8d8';ctx.fillText(TX(TOUCH?'pick_touch':'pick_mouse'),W/2,r[2].y+r[2].h+24);
}
function chestScreen(W,H){
  ctx.fillStyle='rgba(2,8,22,0.66)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';
  const R=chestRes,w=Math.min(360,W-36),h=54,gap=10,n=R.items.length,y0=H/2-((h+gap)*n-gap)/2+10;

  R.items.forEach((it,i)=>{const y=y0+i*(h+gap),q=it.r||0;ctx.fillStyle=RF[q]+'0.94)';ctx.strokeStyle=RC[q];ctx.lineWidth=q?2.5:1;rrect(W/2-w/2,y,w,h,10);ctx.fill();ctx.stroke();
    ctx.textAlign='left';ctx.fillStyle='#fff';fitFont(it.n,18,900,w*0.55);ctx.fillText(it.n,W/2-w/2+16,y+h/2-(it.d?9:0));
    if(it.d){fitFont(it.d,12,'bold',w-90);ctx.fillStyle='#ffe9a8';ctx.fillText(it.d,W/2-w/2+16,y+h/2+13);}
    const tag=q===2?TX('evo_tag'):it.lv?(it.lv>=it.max?'MAX':'Lv'+it.lv):'';if(tag){ctx.textAlign='right';ctx.font=`900 14px ${FONT}`;ctx.fillStyle=RC[q];ctx.fillText(tag,W/2+w/2-16,y+h/2);}

function endLayout(W,H){const bw=Math.min(170,(W-50)/2),y=Math.round(H/2+96);return{retry:{x:W/2-bw-8,y,w:bw,h:52},title:{x:W/2+8,y,w:bw,h:52}};}

// ---------- loop ----------
reset(DEMO);
let last=performance.now();
function frame(now){
  const raw=now-last,dt=Math.min(0.033,raw/1000);last=now;
  if(state==='play'&&!QFORCED&&raw<250){perfEma=perfEma*0.95+raw*0.05;
    if(perfCool>0)perfCool-=raw/1000;
    else if(perfEma>24){perfBad+=raw/1000;if(perfBad>1.5&&QL>0){QL--;resize();perfBad=0;perfCool=3;perfEma=16;}}
    else perfBad=Math.max(0,perfBad-raw/2000);}
  if(state==='play'){if(hitstop>0)hitstop-=dt;else update(dt);updateFx(dt);}
  else if(state==='over'||state==='clear'){overT+=dt;updateFx(dt);}
  else if(state==='level'||state==='chest')updateFx(0);
  const cur=state==='play'?'none':'default';if(cv.style.cursor!==cur)cv.style.cursor=cur;
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__g={get s(){return{state,T,kills,bestCombo,enemies:enemies.length,orbs:orbs.length,lvl:P.lvl,hp:P.hp,captures:captures.length,
  tail:Math.round(P.tailLen),S:+P.S.toFixed(2),stage:P.stage,touch:TOUCH,dashT:+P.dashT.toFixed(2),dashCdT:+P.dashCdT.toFixed(2),dashBase:P.dashBase,dashStacks:P.dashStacks,xpNeed:P.xpNeed,xp:P.xp,
  a:+P.a.toFixed(3),mx,my,types:[...new Set(enemies.map(e=>e.t.k))].join(','),
  boss:P.boss?{name:P.boss.t.name,sh:P.boss.sh}:null,gas:gas.length,chests:chests.length,QL,parts:parts.length,toxins:enemies.filter(e=>e.t.k==='toxin').length,wave:P.waveKey,lv:JSON.stringify(P.lv),shelled:enemies.filter(e=>e.sh>0&&!e.boss).length,bubbles:bub.act.length,bossKills,calm:Math.max(0,calmUntil-T)};},
  get P(){return P;},get meta(){return META;},get choices(){return choices;},get E(){return enemies;},dash,addXP,spawnBoss,stageUp,reset,onLoop,spawnToxin,dropChest,waveEvent,puff,setLang,get lang(){return LANGS[LI];}};
})();
