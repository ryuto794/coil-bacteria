function skinTab(k,fin){const key=k.id+'|'+fin;let t=SKC.get(key);if(t)return t;
  const hsl=(c,dl,ds)=>`hsl(${Math.round(fin>=0&&!c[3]?fin:c[0])},${Math.round(Math.min(100,c[1]+(ds||0)))}%,${Math.round(Math.min(95,c[2]+dl))}%)`,seq=[];

    t={seq:seq.map(c=>[hsl(c,0),hsl(c,12,16)])};}
  else{const K=k.cols.length,sg=k.seg||4;
    if(k.pat==='grad'||k.pat==='star')for(let i=0;i<K;i++){const a=k.cols[i],b=k.cols[(i+1)%K],dh=((b[0]-a[0]+540)%360)-180;for(let s=0;s<sg;s++){const u=s/sg;seq.push([(a[0]+dh*u+360)%360,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u]);}}
    else if(k.pat==='run')seq.push(k.cols[0]);
    else k.cols.forEach((c,i)=>{for(let s=0,m=k.runs?k.runs[i]:sg;s<m;s++)seq.push(c);});

  const d=Math.hypot(W,H)/2*Sx+t.r+60*Sx,sh=Math.min(8,t.sh+P.bossN); // endless: each return has one more shell and more HP
  const e={x:P.x+Math.cos(a)*d,y:P.y+Math.sin(a)*d,vx:0,vy:0,t,hp:Math.round(t.hp*(1+0.5*P.bossN)),r:t.r,ang:0,spd:t.spd,flash:0,cap:null,dead:false,ph:0,
    sh,shMax:sh,sc:1,xpB:1,slowT:0,spk:0,boss:true,lastCrack:-99,regenT:0,minT:6};
  enemies.push(e);P.boss=e;
  banner={t:3,max:3,title:TX('boss_in'),sub:TX('boss_in_s',t.name,sh)};shake=Math.max(shake,8);sfx('boss');
}
// Hydra: arms that rest spread out round the body. One that is near the head's path draws back (0.5 s; a red line shows where it will go), shoots out to
// where the head is heading, and comes home. q: 0 resting, 1 drawing back, 2 shooting out, 3 coming home. No more than two are out at a time.
function armsTick(e,dt){const S=P.S,n=e.t.arms,R0=e.r*2.2,R1=e.r*4.6;
  if(!e.arms){e.arms=[];for(let i=0;i<n;i++)e.arms.push({a:i/n*TAU,q:0,qT:rand(1,2.5),x:e.x,y:e.y,tx:0,ty:0});}
  let busy=0;for(const m of e.arms)if(m.q)busy++;
  const pd=Math.hypot(P.x-e.x,P.y-e.y);if(e.bite>0)e.bite-=dt;
  for(const m of e.arms){m.qT-=dt;const ra=m.a+Math.sin(T*0.9+m.a*3)*0.25;let gx=e.x+Math.cos(ra)*R0,gy=e.y+Math.sin(ra)*R0,k=6;
    if(m.q===0){if(m.qT<=0&&busy<2&&pd<R1+40*S&&!e.cap&&P.freezeT<=0){ // it aims ahead of the head
        const px=P.x+Math.cos(P.a)*P.spd*S*0.55,py=P.y+Math.sin(P.a)*P.spd*S*0.55,ax=px-e.x,ay=py-e.y,ad=Math.hypot(ax,ay)+0.01;
        if(Math.abs(angDiff(ra,Math.atan2(ay,ax)))<0.9){const rr=Math.min(R1,ad+30*S);m.tx=e.x+ax/ad*rr;m.ty=e.y+ay/ad*rr;m.q=1;m.qT=0.5;busy++;tip('arms');}}}
    else if(m.q===1){gx=e.x+Math.cos(ra)*R0*0.6;gy=e.y+Math.sin(ra)*R0*0.6;k=8;if(m.qT<=0){m.q=2;m.qT=0.2;}}
    else if(m.q===2){gx=m.tx;gy=m.ty;k=24;if(m.qT<=0){m.q=3;m.qT=0.9;}}
    else{k=3.5;if(m.qT<=0){m.q=0;m.qT=rand(0.9,1.8);}}
    m.x+=(gx-m.x)*Math.min(1,k*dt);m.y+=(gy-m.y)*Math.min(1,k*dt);
    if((m.q===2||(m.q===3&&m.qT>0.65))&&!(e.bite>0)){const qx=P.x-m.x,qy=P.y-m.y,hr=e.r*0.2+12*S;if(qx*qx+qy*qy<hr*hr&&hitHead(e.t.dmg,e.t))e.bite=0.6;}}}
function bossTick(e,dt){
  if(e.t.arms)armsTick(e,dt);
  if(e.t.pull&&!e.cap){const S=P.S,dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)+0.01;if(d<330*S&&P.dashT<=0){P.x-=dx/d*70*S*dt;P.y-=dy/d*70*S*dt;e.pl=0.2;}} // Stentor: a strong whirlpool
  if(e.sh<e.shMax&&T-e.lastCrack>5){e.regenT+=dt;if(e.regenT>=3.5){e.regenT=0;e.sh++;text(e.x,e.y-e.r-12*P.S,TX('regen'),18,'#9fc9e8',0.8);}}
  e.minT-=dt;if(e.minT<=0){e.minT=9;spawnCluster(P.stage===0?6:5,{x:e.x,y:e.y,r:e.r});}
}
function bossDown(e){
  P.boss=null;bossKills++;banner=null;hitstop=Math.max(hitstop,0.18);shake=Math.max(shake,24);flashT=0.4;P.inv=Math.max(P.inv,2);sfx('bossdown');vib([80,40,120]);
  text(e.x,e.y,TX('boss_down',e.t.name),40,'#ffe680',1.6);
  if(CS===0)mission(['boss1','boss2','clear'][P.stage]);
  if(P.stage<STAGE_N.length-1){dropChest(e.x,e.y,true);stageUp();} // the last scale's boss ends the stage
  else if(P.endless){P.bossN++;P.nextBoss=T+75;dropChest(e.x,e.y,true);}
  else{P.clearAt=T+1.4;calmUntil=1e9;}
}
// A boss is down: the player moves up a scale. The camera pulls back by GROW and the tail grows with it, so the snake looks the same
// and the world looks smaller. Nothing is removed: the creatures of the scale just left turn into prey, and bigger ones start to arrive.
function stageUp(){
  const s=++P.stage;P.grow*=GROW;P.stageT=T;calmUntil=T+4;P.st0=P.tailLen;P.waveT=0.5;
  banner={t:2.6,max:2.6,title:TX('scale_up'),sub:TX('scale_up_s',stageName(s))};flashT=0.35;shake=Math.max(shake,12);P.inv=Math.max(P.inv,1.6);sfx('stage');
  for(const e of enemies){if(e.boss)continue;if(isPrey(e)){e.pr=true;e.hp=1;e.sh=0;e.elite=false;e.lat=0;}
    const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)+1;e.vx+=dx/d*700*P.S;e.vy+=dy/d*700*P.S;}
  rings.push({x:P.x,y:P.y,r:20*P.S,R:520*P.S,life:0.8,max:0.8,col:'#eaffb0',w:8*P.S});
  growTail(1.04);bubbleStage();tip('prey');
  if(CS===0){if(s>=1)mission('cell');if(s>=2&&!P.gasEver)mission('nogas');}
}
// the head takes a hit (contact or a shot). false while the grace time after a hit is running, and in auto-play
function hitHead(raw,by){if(P.inv>0||DEMO||(P.phase&&P.dashT>0))return false;const S=P.S; // Phase Dash: nothing hurts during a dash
  if(P.guard>0){P.guard--;P.guardT=0;P.inv=0.75;sfx('crack');vib(20);rings.push({x:P.x,y:P.y,r:14*S,R:70*S,life:0.35,max:0.35,col:'#9fe8ff',w:5*S});text(P.x,P.y-40*S,TX('blocked'),22,'#9fe8ff',0.9);return false;} // a barrier takes the hit
  const dm=Math.max(1,Math.round(raw*(1-0.15*P.horn)*(1-0.1*P.armor)));
  P.hp-=dm;P.inv=0.75;shake=Math.max(shake,8);sfx('hurt');vib(50);burst(P.x,P.y,14,'#ff6070',200,0.4,3);hpHitAt=performance.now();
  text(P.x,P.y-40*S,'-'+dm,30,'#ff4a5c',1.1);const who=by&&(by.name||by.n);if(who)text(P.x,P.y-16*S,who,14,'#ffc0c8',1.1); // how much, and what did it
  if(P.hp<=0)die(by);return true;}
// by: the enemy type that landed the last hit, or 'gas'
function die(by){
  if(P.revive>0){const S=P.S;P.revive=0;P.revived=true;P.hp=P.maxHp*0.5;P.inv=2.5;flashT=0.3;text(P.x,P.y-44*S,TX('revived'),30,'#ffe680',1.4);
    rings.push({x:P.x,y:P.y,r:20*S,R:420*S,life:0.7,max:0.7,col:'#ffe680',w:8*S});
    for(const e of enemies){const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)+1;if(d<420*S){e.vx+=dx/d*600*S;e.vy+=dy/d*600*S;}}
    sfx('chest');vib(80);return;}
  P.hp=0;P.killer=by;state='over';overT=0;burst(P.x,P.y,80,'#7dffb0',380,1.2,4);endRun(false);sfx('over');vib(200);}
// keep playing after the clear: the last boss returns every 75 s, stronger each time, and the waves keep growing
function goEndless(){if(state!=='clear')return;state='play';runRes=null;P.endless=true;P.bossN=1;P.nextBoss=T+45;calmUntil=T+4;P.inv=Math.max(P.inv,2);P.waveT=0.5;
  banner={t:2.6,max:2.6,title:TX('endless'),sub:TX('endless_s')};}
function endRun(clear){if(runRes)return;
  const b=bestOf(CS),total=Math.floor(kills/25)+bossKills*25+P.stage*10+Math.floor(T/30)+((clear||P.cleared)?100:0),dna=total-P.dnaPaid,rec=[];
  if(!P.counted){P.counted=true;META.runs=(META.runs||0)+1;}
  if(META.runs>1){if(T>b.t+1)rec.push('t');if(kills>(b.kills||0))rec.push('k');if(bestCombo>(b.combo||0))rec.push('c');} // new records (not on the very first run)
  META.dna+=dna;P.dnaPaid=total;META.time+=T-P.timePaid;P.timePaid=T;META.stats.kills+=kills-P.killsPaid;P.killsPaid=kills;
  if(T>b.t)b.t=Math.floor(T);if(kills>(b.kills||0))b.kills=kills;if(bestCombo>(b.combo||0))b.combo=bestCombo;if(P.stage>b.stage)b.stage=P.stage;
  if(clear){b.clears=(b.clears||0)+1;P.cleared=true;}
  if(META.stats.kills>=3000)mission('kills');
  saveMeta();runRes={dna,clear,newU:runNew.slice(),rec,mis:runMis.slice()};
}
function unlock(id){if(META.unlocked.includes(id))return;META.unlocked.push(id);saveMeta();
  const c=RARE.find(r=>r.id===id);if(c){toasts.push({s:TX('unlock',c.n),sub:TX('unlock_s'),life:3.2,max:3.2});runNew.push(c.n);sfx('item');}}

function misDone(m){return m.card?META.unlocked.includes(m.card):!!META.done[m.id];}
function mission(id){const m=MISSIONS.find(x=>x.id===id);if(!m||misDone(m))return;

// ---------- obstacles: air bubbles under the cover glass ----------
const bub={cache:new Map(),act:[],fade:[],key:''};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function chunkB(st,cx,cy,instant){const k=st+'|'+cx+'|'+cy;let a=bub.cache.get(k);if(a)return a;
  const SS=STAGE_S[st],CH=900*SS,r=mulberry((cx*73856093)^(cy*19349663)^(st*83492791)^RUNSEED);a=[];
  const q=r(),n=q<0.3?0:q<0.75?1:2;
  for(let i=0;i<n;i++){const rad=(55+r()*70)*SS,x=(cx+0.12+r()*0.76)*CH,y=(cy+0.12+r()*0.76)*CH,ph=r()*TAU;
    if(st===0&&Math.hypot(x,y)<rad+320)continue;
    if(Math.hypot(x-P.x,y-P.y)<rad+200*SS)continue;
    if(a.some(b=>Math.hypot(b.x-x,b.y-y)<b.r+rad+90*SS))continue;
    a.push({x,y,r:rad,a:instant?1:0,wob:0,ph});}
  bub.cache.set(k,a);return a;}
function updateBubbles(dt,instant){const st=P.stage,CH=900*STAGE_S[st],pcx=Math.floor(P.x/CH),pcy=Math.floor(P.y/CH),key=st+'|'+pcx+'|'+pcy;
  if(key!==bub.key){bub.key=key;const L=[];for(let ox=-2;ox<=2;ox++)for(let oy=-2;oy<=2;oy++)for(const b of chunkB(st,pcx+ox,pcy+oy,instant))L.push(b);bub.act=L;
    if(bub.cache.size>400){const keep=new Map();for(let ox=-2;ox<=2;ox++)for(let oy=-2;oy<=2;oy++){const k=st+'|'+(pcx+ox)+'|'+(pcy+oy);if(bub.cache.has(k))keep.set(k,bub.cache.get(k));}bub.cache=keep;}}
  for(const b of bub.act){if(b.a<1)b.a=Math.min(1,b.a+dt*1.6);if(b.wob>0)b.wob-=dt;}
  for(const b of bub.fade)b.a-=dt*1.5;bub.fade=bub.fade.filter(b=>b.a>0);
}
function bubbleStage(){bub.fade=bub.act.filter(b=>b.a>0);bub.act=[];bub.key='';}
function resetBubbles(){bub.cache=new Map();bub.act=[];bub.fade=[];bub.key='';updateBubbles(0,true);}
// push a circle out of solid bubbles; returns the bubble it touched
function pushOut(o,r){for(const b of bub.act){if(b.a<0.95)continue;const dx=o.x-b.x,dy=o.y-b.y,m=b.r+r;
  if(dx>m||dx<-m||dy>m||dy<-m)continue;const d2=dx*dx+dy*dy;if(d2<m*m){const d=Math.sqrt(d2)||0.01;o.x=b.x+dx/d*m;o.y=b.y+dy/d*m;return b;}}return null;}

// ---------- combat ----------
function hurt(e,d,xpMul,grp){if(e.sh>0){e.flash=0.06;return false;}e.hp-=P.absz&&e.frz>0?d*2:d;e.flash=0.1;if(e.hp<=0&&!e.dead){kill(e,xpMul===undefined?1:xpMul,grp);return true;}return false;}
function kill(e,xpMul,grp){ // grp: the chain this kill belongs to, if any (see boom())
  e.dead=true;burst(e.x,e.y,e.boss?70:6,e.t.col,e.boss?440:140,e.boss?1.1:0.45,e.boss?5:3);kills++;sfx('pop');dropTick(e);
  const v=e.pr?PREY_XP*xpMul:e.t.xp*xpMul*(e.xpB||1);
  if(e.boss||e.titan){for(let k=0;k<14;k++)orbs.push({x:e.x+rand(-0.6,0.6)*e.r,y:e.y+rand(-0.6,0.6)*e.r,v:v/14,ph:Math.random()*TAU,vx:rand(-160,160),vy:rand(-160,160)});}
  else if(e.pr)addXP(v);
  else if(orbs.length<450)orbs.push({x:e.x+rand(-6,6),y:e.y+rand(-6,6),v,ph:Math.random()*TAU,vx:rand(-40,40),vy:rand(-40,40)});
  else addXP(v);
  if(e.shMax>0)mission('shell');
  if(e.elite&&!e.boss&&(e.shMax>=2||Math.random()<0.35))dropChest(e.x,e.y,false);
  if(e.t.k==='toxin'){META.stats.toxins++;if(META.stats.toxins>=10)mission('toxin');puff(e.x,e.y,e.r*4.5,6);for(let k=0;k<3;k++){const a=Math.random()*TAU;puff(e.x+Math.cos(a)*e.r*2,e.y+Math.sin(a)*e.r*2,e.r*2.5,5);}}
  if(e.t.boom)boom(e,xpMul,grp);
  if(P.chainR&&!e.pr&&!e.t.boom&&!e.boss&&!e.titan&&Math.random()<0.2)boom(e,xpMul,grp,Math.max(70,e.r*2.6)); // Chain Reaction
  if(P.leech&&!e.pr&&++P.leechN>=12){P.leechN=0;if(P.hp<P.maxHp){P.hp=Math.min(P.maxHp,P.hp+4);text(P.x,P.y-30*P.S,'+4',14,'#9dffc4',0.6);}} // Leech
  if(e.burn>0){const S=P.S; // v16: a burning enemy that dies passes the fire on (Wildfire), and blows up (Inferno; not the small crushable ones)
    if(P.spread){const R=(50+40*P.spread)*S;let n=0;for(const o of enemies){if(o===e||o.dead||o.burn>0||o.sh>0)continue;const dx=o.x-e.x,dy=o.y-e.y,rr=R+o.r;if(dx*dx+dy*dy<rr*rr){ignite(o,2.5);if(++n>=6)break;}}}
    if(P.inferno&&!e.pr&&!e.t.boom)boom(e,xpMul,grp,Math.max(80,e.r*3));}
  if(e.t.split&&!e.pr)spawnQ.push([e.t.split[0],e.t.split[1],e.x,e.y,e.r]);
  if(e.boss)bossDown(e);
  if(e.hunter)hunterDown(e);
  if(e.titan)titanDown(e);
}
// ---------- chain explosions ----------
// A Blast Germ blows up shortly after it dies, however it died. The blast kills what is near (shells lose one layer instead),
// and any Blast Germ it kills blows up in turn. It never hurts the player.
// grp ties one chain together: {n: kills by blasts, base: kills by the squeeze that started it, live: blasts still to go off}
let booms=[];
function boom(e,xpMul,grp,R){grp=grp||{n:0,base:0,live:0};grp.live++;booms.push({x:e.x,y:e.y,r:R||80*e.sc,t:0.13,xpMul,grp});}
function boomTick(dt){
  for(const b of booms){b.t-=dt;if(b.t>0)continue;const S=P.S,g=b.grp;b.done=true;g.live--;
    rings.push({x:b.x,y:b.y,r:b.r*0.2,R:b.r,life:0.35,max:0.35,col:'#ffd27a',w:7*S});burst(b.x,b.y,26,'#ffb020',420,0.6,4);burst(b.x,b.y,10,'#ffffff',260,0.4,3);
    shake=Math.max(shake,9);sfx('boom',8);
    for(const e of enemies){if(e.dead)continue;const dx=e.x-b.x,dy=e.y-b.y,rr=b.r+e.r;if(dx*dx+dy*dy>rr*rr)continue;
      if(e.hunter||e.titan)continue;if(e.sh>0)crackShell(e,1);else if(e.boss)hurt(e,8*(1+P.stage),b.xpMul,g);else{kill(e,b.xpMul,g);g.n++;}}
    if(g.live<=0&&g.n>0){const tot=g.base+g.n;text(b.x,b.y-30*S,TX('chain',g.n),22+Math.min(24,g.n),'#ffd27a',1.2);
      bestCombo=Math.max(bestCombo,tot);if(tot>=20)mission('c20');if(tot>=50)mission('c50');vib(25);}}
  compact(booms,b=>!b.done);
}
function crackShell(e,n){const k=Math.min(n,e.sh);if(k<=0)return;e.sh-=k;e.lastCrack=T;e.regenT=0;
  burst(e.x,e.y,10+k*6,'#d8f4ff',220*(e.boss?1.6:1),0.55,3);shake=Math.max(shake,e.boss?6:3);sfx('crack');
  if(e.sh===0&&(e.boss||e.hunter||e.titan||e.elite))text(e.x,e.y-e.r-10*P.S,TX('cracked'),e.boss||e.hunter||e.titan?26:16,'#d8f4ff',0.9); // common shelled enemies: the ring vanishing is enough
  else if(e.boss||e.hunter||e.titan)text(e.x,e.y-e.r-10*P.S,TX('shell_left',e.sh),22,'#d8f4ff',0.8);}
function addXP(v){P.xp+=v*P.xpMul;while(P.xp>=P.xpNeed){P.xp-=P.xpNeed;P.lvl++;P.xpNeed=Math.round(40+P.lvl*10+P.lvl*P.lvl*1.5);pendingLv++;}}
function dash(){
  if(state!=='play'||P.dashCdT>0)return;
  P.dashT=P.dashBase;P.dashAge=0;P.dashCdT=P.dashCd;P.ghostT=0;P.dashN++;sfx('dash');if(P.dashN>2)tip('stretch');
  burst(P.x,P.y,22,'#9dffc4',240,0.4,3);
  rings.push({x:P.x,y:P.y,r:6*P.S,R:60*P.S,life:0.3,max:0.3,col:'#d8ffe6',w:4*P.S});
  let any=false;for(const c of captures)if(c.cinchT<0){if(c.hold>0)c.dash=true;else cinch(c,true);any=true;}
  shake=Math.max(shake,any?7:3);
}
const MAXC=10; // most laps one coil can hold
const STR_HOLD=1.0; // after a dash ends the tail tip stays put this long (the body is stretched); then the length eases back
// start the squeeze of one coil. Coils squeezed one after another make a chain: each goes 0.14 s after the one before, and each is stronger (see explode())
function cinch(c,dsh){
  const live=T<P.chainAt+1.3,at=live?Math.max(T,P.chainAt+0.14):T;
  c.link=live?P.chainN+1:0;P.chainN=c.link;P.chainAt=at;c.dash=dsh;if(!live)P.chainId++;c.chain=P.chainId;
  if(at>T)c.hold=at-T;else c.cinchT=0;
}
// a figure eight (two loops side by side, drawn in opposite directions): both go at once at dash strength, and a third blast covers them both
function infinity(a,b){
  const S=P.S,mx=(a.c.x+b.c.x)/2,my=(a.c.y+b.c.y)/2,R=Math.hypot(a.c.x-b.c.x,a.c.y-b.c.y)/2+Math.max(a.rad,b.rad)*0.9,poly=[];
  for(let i=0;i<28;i++){const t=i/28*TAU;poly.push({x:mx+Math.cos(t)*R,y:my+Math.sin(t)*R});}
  const f={poly,c:{x:mx,y:my},rad:R,area:Math.PI*R*R,rnd:1,charge:Math.min(MAXC,a.charge+b.charge),timer:P.captT,cinchT:-1,dash:true,pop:1,inf:1};captures.push(f);
  for(const e of enemies){if(e.dead)continue;const dx=e.x-mx,dy=e.y-my;if(dx*dx+dy*dy<R*R){if(!e.cap)e.cap=f;if(e.sh>0)crackShell(e,1);}}
  if(a.cinchT<0&&!a.done){if(a.hold>0)a.dash=true;else cinch(a,true);}
  cinch(b,true);cinch(f,true);a.inf2=b.inf2=1;
  text(mx,my,'\u221e',64,'#ffd86a',0.55);rings.push({x:mx,y:my,r:R*0.3,R:R*1.1,life:0.5,max:0.5,col:'#ffd86a',w:6*S});sfx('chain',4);shake=Math.max(shake,9);
}
const CAPT_TIME=1.6;
// old: the head crossed a part of the trail that lies behind an earlier crossing (such crossings were not looked at before v24)
function onLoop(poly,old){
  const c=centroid(poly),ar=polyArea(poly),area=Math.abs(ar),sgn=ar>0?1:-1,free=k=>k.cinchT<0&&!(k.hold>0);let rad=0,per=0;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const q=poly[i];rad+=Math.hypot(q.x-c.x,q.y-c.y);per+=Math.hypot(q.x-poly[j].x,q.y-poly[j].y);}rad/=poly.length;
  const rnd=12.566*area/(per*per); // how round the region is: 1 = a circle, about 0.25 = a sliver ten times as long as it is wide
  let cap=captures.find(k=>free(k)&&Math.hypot(k.c.x-c.x,k.c.y-c.y)<k.rad*1.2+30*P.S),crack=1,fresh=false;
  if(old){ // such a region is a lap only when it goes around the coil that stands there. A piece of a standing coil is nothing new. Anything else is a region of its own
    if(cap&&!(inPoly(cap.c.x,cap.c.y,poly)&&area>=0.5*cap.area))cap=null;
    if(!cap&&captures.some(k=>free(k)&&inPoly(c.x,c.y,k.poly)))return;
  }
  if(cap){cap.charge=Math.min(MAXC,cap.charge+1);cap.poly=poly;cap.c=c;cap.rad=rad;cap.area=area;cap.rnd=rnd;cap.timer=P.captT;cap.pop=1;
    text(c.x,c.y-rad,TX('coil_n',cap.charge),22+cap.charge*3,'#b6ffd2',0.8);}
  else{const c0=P.bigcoil?3:P.helix?2:1;cap={poly,c,rad,area,rnd,charge:c0,timer:P.captT,cinchT:-1,dash:false,pop:1};captures.push(cap);crack=c0;fresh=true;
    text(c.x,c.y-rad,c0>1?TX('enclose_n',c0):TX('enclose'),22,'#b6ffd2',0.7);tip('dash');
    const st=captures.filter(free);if(st.length>7)cinch(st[0],false);} // no more than seven coils stand at once
  P.loops++;sfx('loop',cap.charge);if(cap.charge>=6)mission('coil6');if(cap.charge>=MAXC)mission('coil10');
  crack+=P.enzyme+(P.storm?1:0);if(P.storm)bolt(P.x,P.y,c.x,c.y);
  const b=bbox(poly);
  for(const e of enemies){if(e.dead||e.x<b.x0||e.x>b.x1||e.y<b.y0||e.y>b.y1)continue;if(inPoly(e.x,e.y,poly)){e.cap=cap;if(e.sh>0)crackShell(e,crack);}}
  for(let i=0;i<poly.length;i+=3)burst(poly[i].x,poly[i].y,1,'#7dffb0',40,0.5,2.5);
  let inf=false;
  if(fresh){const o=P.lastLoop,oc=o&&o.cap,amin=3200*P.S*P.S; // a figure eight: the loop before this one, drawn the other way round, right beside it. Both must be real loops (not slivers), and it cannot be done again for 4 s
    if(oc&&!oc.inf&&T>=P.infAt&&T-o.t<5&&o.sgn!==sgn&&area>=amin&&oc.area>=amin&&rnd>=0.4&&oc.rnd>=0.4&&Math.min(area,oc.area)>=0.2*Math.max(area,oc.area)&&Math.hypot(oc.c.x-c.x,oc.c.y-c.y)<(oc.rad+rad)*1.5&&!inPoly(oc.c.x,oc.c.y,poly)&&!inPoly(c.x,c.y,oc.poly)){infinity(oc,cap);inf=true;P.infAt=T+4;}
    else if(P.strT>0){cinch(cap,true);text(c.x,c.y-rad-24*P.S,TX('snap'),20,'#ffffff',0.9);} // closed while the body is stretched by a dash: squeezed on the spot, as a dash squeeze
  }
  P.lastLoop=inf?null:{cap,sgn,t:T};
}
function explode(cap){

  const xpMul=(dsh?2:1)*(1+0.35*(ch-1))*(1+0.25*lk),grp={n:0,base:0,live:0};let n=0,heal=0,kept=0;
  for(const e of enemies){if(e.dead)continue;
    if(e.cap===cap||(e.x>=b.x0&&e.x<=b.x1&&e.y>=b.y0&&e.y<=b.y1&&inPoly(e.x,e.y,poly))){
      if(e.sh>0&&e.t.brittle){if(dsh&&!e.pr){crackShell(e,e.sh);text(e.x,e.y-e.r-6*S,TX('snapped'),14,'#fff3c4',0.8);}else tip('brittle');} // a seed shrimp: a dash squeeze breaks the whole shell at once
      if(e.sh>0){kept++;const dx=e.x-c.x,dy=e.y-c.y,d=Math.hypot(dx,dy)+1;e.vx+=dx/d*220*S;e.vy+=dy/d*220*S;
        if(!e.boss&&kept<=2)text(e.x,e.y-e.r-6*S,TX('shell_left',e.sh),14,'#bfe9ff',0.7);continue;}
      kill(e,xpMul,grp);n++;if(dsh&&P.devour)heal++;burst(e.x,e.y,6,dsh?'#d8ffe6':'#7dffb0',260,0.6,3);}}
  const R=((55+26*ch)*P.blast*(dsh?1.7:1)*S+cap.rad*0.6)*(1+0.12*lk),dmg=(1+ch)*(dsh?2:1)*P.blast*(1+P.stage)*(1+0.5*lk);
  for(const b of shots){const dx=b.x-c.x,dy=b.y-c.y;if(dx*dx+dy*dy<R*R)b.life=0;} // a squeeze clears the shots around it
  for(const e of enemies){if(e.dead)continue;const dx=e.x-c.x,dy=e.y-c.y,d=Math.hypot(dx,dy);
    if(d<R+e.r){if(P.shatter&&e.sh>0)crackShell(e,1);if(hurt(e,dmg,xpMul,grp))n++;else{const k=(dsh?520:300)*S/(d+1);e.vx+=dx*k*0.6;e.vy+=dy*k*0.6;}}}
  // Storm Lord: one bolt per enemy killed inside (20 at most), to the nearest enemies outside
  if(P.storm&&n>0){const cand=[],lim=(R+260*S)*(R+260*S);for(const e of enemies){if(e.dead||e.sh>0)continue;const dx=e.x-c.x,dy=e.y-c.y,d2=dx*dx+dy*dy;if(d2<lim)cand.push([d2,e]);}
    cand.sort((a,b)=>a[0]-b[0]);for(let i=0,z=Math.min(n,20,cand.length);i<z;i++){const e=cand[i][1];if(!e.dead)n+=shock(e,5*(1+P.stage)*ch,c.x,c.y,grp,xpMul);}}
  // Needle Burst: needles fly out of the coil and go through whatever is in the way
  if(P.needle){const k=4+4*P.needle,a0=Math.random()*TAU;for(let i=0;i<k;i++){const a=a0+i/k*TAU;needles.push({x:c.x,y:c.y,dx:Math.cos(a),dy:Math.sin(a),v:900*S,life:0.45,dmg:(2+ch)*(1+P.stage),hit:new Set()});}sfx('needle');}
  grp.base=n;
  if(P.absz){const D=Math.hypot(W,H)*0.6*S;for(const e of enemies)if(!e.dead&&Math.abs(e.x-P.x)<D&&Math.abs(e.y-P.y)<D)freeze(e,2);rings.push({x:c.x,y:c.y,r:R*0.5,R:D,life:0.6,max:0.6,col:'#d6f4ff',w:5*S});} // Absolute Zero
  rings.push({x:c.x,y:c.y,r:cap.rad*0.2,R,life:0.5,max:0.5,col:dsh?'#eafff2':'#7dffb0',w:(dsh?10:6)*S});
  if(dsh)rings.push({x:c.x,y:c.y,r:0,R:R*1.35,life:0.7,max:0.7,col:'#62ff9c',w:4*S});
  burst(c.x,c.y,30+n*2,dsh?'#ffffff':'#9dffc4',dsh?520:340,0.8,4);burst(c.x,c.y,20+ch*10,'#4fb8ff',300,0.9,3);

  else if(lk>0&&n>0&&!cap.inf2){text(c.x,c.y-74*S,lk===1?TX('ch2'):lk===2?TX('ch3'):TX('chn',cap.link+1),20+4*lk,'#ffd86a',1.3);sfx('chain',lk);tip('chain');if(cap.link>=2)mission('multi3');}

  if(heal>0){P.hp=Math.min(P.maxHp,P.hp+heal*0.6);text(P.x,P.y-54*S,'+'+Math.ceil(heal*0.6)+' HP',18,'#9dffc4',0.9);}

// the outline of the region closed by a crossing at `hit` on trail segment j: along the trail from there to the head.
// Earlier crossings are kept as knots. Where the walk comes to the older side of one, it steps over the region that knot closed,
// so a zigzag over the tail gives one region per crossing, side by side, and not one outline folded over itself.
function loopPoly(j,hit){
  const tr=P.trail,s0=tr[0].s,n=tr.length,poly=[{x:hit.x,y:hit.y}];let k=j+1,u=hit.u,g=0;
  while(k<n&&g++<n+80){let kn=null;
    for(const q of P.knots)if(q.a===tr[k].s&&q.u>u&&(!kn||q.u<kn.u))kn=q;
    if(kn){poly.push({x:kn.x,y:kn.y});k=kn.b-s0;u=kn.v;continue;}
    poly.push(tr[k]);k++;u=-1;}
  return poly;
}
function advanceTrail(dt){
  if(P.loopCd>0)P.loopCd-=dt;
  const S=P.S,tr=P.trail,L=tr[tr.length-1],ddx=P.x-L.x,ddy=P.y-L.y;
  if(ddx*ddx+ddy*ddy<25*S*S)return;
  const B={x:P.x,y:P.y,s:P.serial++};let hits=null;
  // every place where the new piece of the trail crosses the older trail closes a region (v24: the whole trail counts, not only the part after the last crossing)
  for(let j=tr.length-4;j>=0;j--){const C=tr[j],D=tr[j+1],hit=segInt(L.x,L.y,B.x,B.y,C.x,C.y,D.x,D.y);if(hit){hit.j=j;(hits||(hits=[])).push(hit);}}
  if(hits){if(hits.length>1)hits.sort((a,b)=>a.t-b.t);
    for(const hit of hits){const lk=P.lastKnot;
      if(P.loopCd>0&&lk&&Math.hypot(lk.x-hit.x,lk.y-hit.y)<6*S)continue; // the same crossing, met again on the next step
      const D=tr[hit.j+1],old=tr[hit.j].s<P.minSerial,poly=loopPoly(hit.j,hit),k={a:D.s,u:hit.u,b:B.s,v:hit.t,x:hit.x,y:hit.y};
      P.knots.push(k);P.lastKnot=k;P.minSerial=Math.max(P.minSerial,D.s);P.loopCd=0.1;
      if(poly.length>2&&Math.abs(polyArea(poly))>1600*S*S)onLoop(poly,old);}
  }
  tr.push(B);
  let len=0;const lim=P.tailLen*P.grow+P.str;for(let i=tr.length-1;i>0;i--){len+=Math.hypot(tr[i].x-tr[i-1].x,tr[i].y-tr[i-1].y);if(len>lim){tr.splice(0,i-1);break;}}
  if(P.knots.length&&(P.knots[0].a<=tr[0].s||P.knots.length>60)){const s0=tr[0].s;P.knots=P.knots.filter(q=>q.a>s0);if(P.knots.length>60)P.knots.splice(0,P.knots.length-60);}
}

  if(!list.length)return;ctx.font=`bold 12px ${FONT}`;const maxW=Math.min(W-24,560),rows=[[]];let rw=0;
  for(const c of list){c.w=ctx.measureText(c.s).width+16;if(rw+c.w>maxW&&rows[rows.length-1].length){if(rows.length>=maxRows)break;rows.push([]);rw=0;}rows[rows.length-1].push(c);rw+=c.w+6;}
  rows.forEach((r,i)=>{let x=W/2-r.reduce((a,c)=>a+c.w+6,-6)/2;for(const c of r){ctx.fillStyle=RF[c.q]+'0.9)';ctx.strokeStyle=RC[c.q];ctx.lineWidth=1;rrect(x,y+i*26-10,c.w,20,10);ctx.fill();ctx.stroke();
    ctx.textAlign='center';ctx.fillStyle='#e8f6ff';ctx.fillText(c.s,x+c.w/2,y+i*26+1);x+=c.w+6;}});
}

function overScreen(W,H){endScreen(W,H,false);}
function clearScreen(W,H){endScreen(W,H,true);}

reset(DEMO);
let last=performance.now();
function frame(now){
  const raw=now-last,dt=Math.min(0.033,raw/1000);last=now;
  if(state==='play'&&!QFORCED&&raw<250){perfEma=perfEma*0.95+raw*0.05;
    if(perfCool>0)perfCool-=raw/1000;
    else if(perfEma>24){perfBad+=raw/1000;if(perfBad>1.5&&QL>0){QL--;resize();perfBad=0;perfCool=3;perfEma=16;}}
    else perfBad=Math.max(0,perfBad-raw/2000);}
  if(state==='play'){if(hitstop>0)hitstop-=dt;else update(dt);updateFx(dt);}
  else if(state==='over'||state==='clear'){overT+=dt;updateFx(dt);}
  else if(state==='level'||state==='chest'||state==='pause'||state==='menu')updateFx(0);
  const cur=state==='play'?'none':'default';if(cv.style.cursor!==cur)cv.style.cursor=cur;
  render();requestAnimationFrame(frame);
}
